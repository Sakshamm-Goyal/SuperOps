# One controlled host, private network, durable volumes (docs/OPERATIONS.md). Only api/ui publish ports, on localhost;
# put a TLS reverse proxy in front for any hosted use. Source databases for Zetaris must be hosted where your Zetaris
# workspace can reach them (not this compose network).
name: greenops-verify
services:
  db:
    image: postgres:17
    environment: {POSTGRES_USER: greenops, POSTGRES_DB: greenops_app, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD", "pg_isready", "-U", "greenops"], interval: 5s, retries: 20}
  sidecar:
    build: ./memory-sidecar
    environment:
      MEMORY_AUTH_TOKEN: "${MEMORY_AUTH_TOKEN:?set MEMORY_AUTH_TOKEN}"
      HMEM_DATA_DIR: /data
      HOST: 0.0.0.0
      EMBEDDING_MODE: "${EMBEDDING_MODE:?set EMBEDDING_MODE}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      EMBEDDING_MODEL_ID: "${EMBEDDING_MODEL_ID:-nvidia/nv-embedqa-e5-v5}"
    volumes: [hmem:/data]
  api:
    build: .
    command: ["uvicorn", "greenops.api.app:get_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment: {DATABASE_URL: "postgresql://greenops:${POSTGRES_PASSWORD}@db:5432/greenops_app", MEMORY_BASE_URL: "http://sidecar:7410", SANDBOX_DIR: /sandbox}
    volumes: [sandbox:/sandbox]
    depends_on: {db: {condition: service_healthy}}
    ports: ["127.0.0.1:8000:8000"]
  worker:
    build: .
    command: ["sh", "-c", "python scripts/sandbox.py up && python -m greenops.worker.main"]
    env_file: .env
    environment: {DATABASE_URL: "postgresql://greenops:${POSTGRES_PASSWORD}@db:5432/greenops_app", MEMORY_BASE_URL: "http://sidecar:7410", SANDBOX_DIR: /sandbox}
    volumes: [sandbox:/sandbox]
    depends_on: {db: {condition: service_healthy}}
  ui:
    build: .
    command: ["streamlit", "run", "greenops/ui/app.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.headless", "true"]
    environment: {GREENOPS_API_URL: "http://api:8000"}
    ports: ["127.0.0.1:8501:8501"]
volumes: {pgdata: {}, hmem: {}, sandbox: {}}
